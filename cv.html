        .main-content { flex: 1; min-width: 0; padding-top: 0; }
        .section-title { font-size: 1.8rem; line-height: 1; margin: -0.25rem 0 1.5rem; }
        .cv-link { display: inline-block; margin-top: 1rem; color: #333; text-decoration: none; font-weight: 700; border-bottom: 1px solid #999; }

        @media (max-width: 48rem) {

            .sidebar { width: min(100%, 16rem); flex-basis: auto; }
